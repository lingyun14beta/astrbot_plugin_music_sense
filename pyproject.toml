[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["tests"]

[tool.ruff.lint]
select = [
  "F",     # Pyflakes
  "W",     # pycodestyle warnings
  "E",     # pycodestyle errors
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "Q",     # flake8-quotes
  "I",     # import-order
  "UP",    # pyupgrade
]
ignore = [
  "E501",
  "ASYNC230", # TODO: handle ASYNC230
  "ASYNC240", # 本地文件元数据检查（is_file/stat），阻塞可忽略；与 AstrBot 官方配置一致
]
